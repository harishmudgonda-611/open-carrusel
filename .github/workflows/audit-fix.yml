name: Temporary npm audit fix

on:
  push:
    branches: [rpd-product-fidelity-pipeline]
    paths:
      - .github/workflows/audit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpd-product-fidelity-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Audit remaining issues
        run: npm audit --json > audit.json || true
      - name: Summarize audit
        run: node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities,null,2)); console.log(Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,fixAvailable:v.fixAvailable})))'
      - name: Validate
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
      - name: Commit dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Apply non-breaking npm audit fixes" && git push origin rpd-product-fidelity-pipeline; fi
